# Full reproducible environment, Python + R, via conda/mamba:
#   mamba env create -f environment.yml && conda activate trade-dna
name: trade-dna
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.2
  - numpy>=1.26
  - plotly>=5.24
  - pyarrow>=17
  - requests>=2.32
  - pytest>=8
  - pip
  - pip:
      - streamlit>=1.50
  # R side (base R is enough for r/seasonality.R; add packages your scripts need)
  - r-base>=4.3
  # - r-forecast
  # - r-seasonal
